<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <title>Dance Planner</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #f8fafc;
    }

    html.dark {
      background: #020617;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    html.dark body {
      background: #020617;
      color: #f8fafc;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0.6;
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      scrollbar-width: none;
    }

    .fade-enter-active,
    .fade-leave-active {
      transition: opacity .18s ease;
    }

    .fade-enter-from,
    .fade-leave-to {
      opacity: 0;
    }

    .modal-enter-active,
    .modal-leave-active {
      transition: all .18s ease;
    }

    .modal-enter-from,
    .modal-leave-to {
      opacity: 0;
      transform: translateY(10px);
    }
  </style>
</head>

<body>
<div id="app"></div>

<script>
const { createApp, ref, reactive, computed, watch, onMounted, onBeforeUnmount } = Vue;

const STORAGE = {
  currency: 'dp_currency_v2',
  schools: 'dp_schools_v2',
  groups: 'dp_groups_v2',
  lessons: 'dp_lessons_v2',
  types: 'dp_types_v2',
  directions: 'dp_directions_v2',
  theme: 'dp_theme_v2',
  reminder: 'dp_reminder_v2',
  notified: 'dp_notified_v2'
};

const DEFAULT_TYPES = [
  {
    id: 'individual',
    name: 'Индив',
    mode: 'fixed',
    amount: 400,
    minPayment: 0,
    ranges: []
  },
  {
    id: 'group',
    name: 'Группа',
    mode: 'fixed',
    amount: 600,
    minPayment: 0,
    ranges: []
  },
  {
    id: 'substitution',
    name: 'Замена',
    mode: 'fixed',
    amount: 600,
    minPayment: 0,
    ranges: []
  },
  {
    id: 'rehearsal',
    name: 'Репетиция',
    mode: 'fixed',
    amount: 600,
    minPayment: 0,
    ranges: []
  },
  {
    id: 'other',
    name: 'Другое',
    mode: 'manual',
    amount: 0,
    minPayment: 0,
    ranges: []
  }
];

function uid(prefix = 'id') {
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed ?? fallback;
  } catch {
    return fallback;
  }
}

function saveJSON(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function normalizeTypes(rawTypes) {
  const source = Array.isArray(rawTypes) && rawTypes.length
    ? rawTypes
    : clone(DEFAULT_TYPES);

  return source.map(type => {
    const normalized = { ...type };

    if (normalized.id === 'individual' ||
        String(normalized.name || '').trim().toLowerCase().includes('индив')) {
      normalized.id = 'individual';
      normalized.name = 'Индив';
    }

    return normalized;
  });
}

function pad(n) {
  return String(n).padStart(2, '0');
}

function dateToISO(date) {
  return [
    date.getFullYear(),
    pad(date.getMonth() + 1),
    pad(date.getDate())
  ].join('-');
}

function todayISO() {
  return dateToISO(new Date());
}

function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function addDays(iso, amount) {
  const d = parseISO(iso);
  d.setDate(d.getDate() + amount);
  return dateToISO(d);
}

function startOfWeek(iso) {
  const d = parseISO(iso);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return dateToISO(d);
}

function endOfWeek(iso) {
  return addDays(startOfWeek(iso), 6);
}

function startOfMonth(iso) {
  const d = parseISO(iso);
  return dateToISO(new Date(d.getFullYear(), d.getMonth(), 1));
}

function endOfMonth(iso) {
  const d = parseISO(iso);
  return dateToISO(new Date(d.getFullYear(), d.getMonth() + 1, 0));
}

function formatDate(iso, options = {}) {
  if (!iso) return '';

  return parseISO(iso).toLocaleDateString('ru-RU', {
    day: 'numeric',
    month: 'long',
    ...options
  });
}

function shortDate(iso) {
  return parseISO(iso).toLocaleDateString('ru-RU', {
    day: '2-digit',
    month: '2-digit'
  });
}

function weekdayShort(iso) {
  return parseISO(iso).toLocaleDateString('ru-RU', {
    weekday: 'short'
  });
}

function monthYear(iso) {
  return parseISO(iso).toLocaleDateString('ru-RU', {
    month: 'long',
    year: 'numeric'
  });
}

function minutesBetween(start, end) {
  if (!start || !end) return 0;

  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);

  let result = (eh * 60 + em) - (sh * 60 + sm);

  if (result < 0) {
    result += 24 * 60;
  }

  return result;
}

function formatHours(minutes) {
  const hours = minutes / 60;

  if (Number.isInteger(hours)) {
    return `${hours} ч`;
  }

  return `${hours.toFixed(1).replace('.', ',')} ч`;
}

function normalizeLesson(lesson) {
  return {
    id: lesson.id || uid('lesson'),
    date: lesson.date || todayISO(),
    start: lesson.start || '10:00',
    end: lesson.end || '11:00',
    type: lesson.type || 'group',
    otherText: lesson.otherText || '',
    studentName: lesson.studentName || '',
    directionId: lesson.directionId || '',
    schoolId: lesson.schoolId || '',
    groupId: lesson.groupId || '',
    people: Number(lesson.people ?? 1),
    payment: Number(lesson.payment ?? 0),
    paymentManual: Boolean(lesson.paymentManual),
    status: lesson.status || 'planned',
    note: lesson.note || '',
    createdAt: lesson.createdAt || Date.now()
  };
}

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

const FormField = {
  props: {
    label: String
  },
  template: `
    <div>
      <label
        v-if="label"
        class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5"
      >
        {{ label }}
      </label>
      <slot></slot>
    </div>
  `
};

const SettingsSection = {
  props: {
    title: String,
    icon: String
  },
  template: `
    <section
      class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden"
    >
      <div
        v-if="title"
        class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 flex items-center gap-2"
      >
        <i v-if="icon" :class="icon" class="text-slate-500"></i>
        <h3 class="font-semibold text-sm">{{ title }}</h3>
      </div>

      <div class="p-4">
        <slot></slot>
      </div>
    </section>
  `
};

const StatCard = {
  props: {
    label: String,
    value: [String, Number],
    icon: String
  },
  template: `
    <div
      class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-3"
    >
      <div class="flex items-center justify-between gap-2">
        <span class="text-xs text-slate-500 dark:text-slate-400">{{ label }}</span>
        <i v-if="icon" :class="icon" class="text-slate-400 text-xs"></i>
      </div>
      <div class="mt-1 text-lg font-bold">{{ value }}</div>
    </div>
  `
};

const PaymentEditor = {
  props: {
    modelValue: Number,
    calculated: Number,
    manual: Boolean,
    currency: String
  },
  emits: ['update:modelValue', 'update:manual'],
  methods: {
    onInput(event) {
      this.$emit('update:modelValue', Number(event.target.value) || 0);
      this.$emit('update:manual', true);
    }
  },
  template: `
    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400">
          Оплата
        </label>

        <button
          v-if="manual"
          type="button"
          @click="$emit('update:manual', false)"
          class="text-[11px] text-blue-600 dark:text-blue-400"
        >
          Авто
        </button>

        <span
          v-else
          class="text-[11px] text-emerald-600 dark:text-emerald-400"
        >
          Автоматически
        </span>
      </div>

      <div class="relative">
        <input
          type="number"
          min="0"
          step="1"
          :value="modelValue"
          @input="onInput"
          class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5 pr-16 outline-none focus:ring-2 focus:ring-blue-500"
        >

        <span
          class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400"
        >
          {{ currency }}
        </span>
      </div>

      <div
        v-if="!manual"
        class="text-[11px] text-slate-400 mt-1"
      >
        По настройкам: {{ calculated }} {{ currency }}
      </div>
    </div>
  `
};

createApp({
  components: {
    FormField,
    SettingsSection,
    StatCard,
    PaymentEditor
  },

  setup() {
    const view = ref('today');

    const selectedDate = ref(todayISO());

    const calendarMode = ref('week');

    const financeMode = ref('month');
    const financeFrom = ref('');
    const financeTo = ref('');

    const schools = ref(loadJSON(STORAGE.schools, []));
    const groups = ref(loadJSON(STORAGE.groups, []));
    const lessons = ref(
      loadJSON(STORAGE.lessons, []).map(normalizeLesson)
    );

    const types = ref(
      normalizeTypes(loadJSON(STORAGE.types, clone(DEFAULT_TYPES)))
    );

    saveJSON(STORAGE.types, types.value);

    const directions = ref(
      loadJSON(STORAGE.directions, [])
    );

    const currency = ref(
      localStorage.getItem(STORAGE.currency) || 'грн'
    );

    const theme = ref(
      localStorage.getItem(STORAGE.theme) || 'system'
    );

    const reminder = ref(
      localStorage.getItem(STORAGE.reminder) || 'off'
    );

    const notified = ref(
      loadJSON(STORAGE.notified, {})
    );

    const showLessonModal = ref(false);
    const showSchoolModal = ref(false);
    const showGroupModal = ref(false);
    const showTypeModal = ref(false);

    const editingLesson = ref(null);

    const schoolForm = reactive({
      id: '',
      name: ''
    });

    const groupForm = reactive({
      id: '',
      name: '',
      schoolId: '',
      customRule: null
    });

    const typeForm = reactive({
      id: '',
      name: '',
      mode: 'fixed',
      amount: 0,
      minPayment: 0,
      ranges: []
    });

    const lessonForm = reactive({
      id: '',
      date: todayISO(),
      start: '10:00',
      end: '11:00',
      type: 'group',
      otherText: '',
      studentName: '',
      directionId: '',
      schoolId: '',
      groupId: '',
      people: 1,
      payment: 0,
      paymentManual: false,
      status: 'planned',
      note: ''
    });

    const calendarTitle = computed(() => {
      if (calendarMode.value === 'month') {
        return monthYear(selectedDate.value);
      }

      if (calendarMode.value === 'week') {
        const start = startOfWeek(selectedDate.value);
        const end = endOfWeek(selectedDate.value);

        const startDate = parseISO(start);
        const endDate = parseISO(end);

        if (
          startDate.getMonth() === endDate.getMonth() &&
          startDate.getFullYear() === endDate.getFullYear()
        ) {
          return `${startDate.getDate()}–${endDate.getDate()} ${startDate.toLocaleDateString('ru-RU', {
            month: 'long',
            year: 'numeric'
          })}`;
        }

        return `${shortDate(start)}–${shortDate(end)}`;
      }

      return formatDate(selectedDate.value);
    });

    const activeSchools = computed(() =>
      schools.value.filter(s => !s.archived)
    );

    const activeGroups = computed(() =>
      groups.value.filter(g => !g.archived)
    );

    const currentSchoolGroups = computed(() => {
      if (!lessonForm.schoolId) {
        return activeGroups.value;
      }

      return activeGroups.value.filter(
        g => g.schoolId === lessonForm.schoolId
      );
    });

    const selectedSchool = computed(() =>
      schools.value.find(s => s.id === lessonForm.schoolId) || null
    );

    const selectedGroup = computed(() =>
      groups.value.find(g => g.id === lessonForm.groupId) || null
    );

    const lessonType = computed(() =>
      types.value.find(t => t.id === lessonForm.type) || null
    );

    function getSchoolName(id) {
      return schools.value.find(s => s.id === id)?.name || 'Без школы';
    }

    function getGroupName(id) {
      return groups.value.find(g => g.id === id)?.name || 'Без группы';
    }

    function getTypeName(type) {
      const found = types.value.find(t => t.id === type);
      if (type === 'individual') return 'Индив';
      if (found?.name && found.name.trim().toLowerCase().includes('индив')) return 'Индив';
      return found?.name || type;
    }

    function getDirectionName(id) {
      return directions.value.find(d => d.id === id)?.name || '';
    }

    function statusLabel(status) {
      const labels = {
        planned: 'Запланировано',
        done: 'Проведено',
        cancelled: 'Отменено'
      };

      return labels[status] || status;
    }

    function statusClass(status) {
      if (status === 'done') {
        return 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300';
      }

      if (status === 'cancelled') {
        return 'bg-red-50 text-red-700 dark:bg-red-950/40 dark:text-red-300';
      }

      return 'bg-blue-50 text-blue-700 dark:bg-blue-950/40 dark:text-blue-300';
    }

    function statusActionClass(lesson, action) {
      if (action === 'done') {
        return lesson.status === 'done'
          ? 'bg-emerald-500 text-white ring-2 ring-emerald-200 dark:ring-emerald-900/60 shadow-sm'
          : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300';
      }

      if (action === 'cancelled') {
        return lesson.status === 'cancelled'
          ? 'bg-red-500 text-white ring-2 ring-red-200 dark:ring-red-900/60 shadow-sm'
          : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300';
      }

      return 'bg-slate-100 dark:bg-slate-800 text-slate-500';
    }

    function lessonMinutes(lesson) {
      return minutesBetween(lesson.start, lesson.end);
    }

    function lessonHours(lesson) {
      return lessonMinutes(lesson) / 60;
    }

    function calculateRule(rule, people) {
      if (!rule) return 0;

      const count = Math.max(0, Number(people) || 0);

      if (rule.mode === 'manual') {
        return 0;
      }

      if (rule.mode === 'fixed') {
        return Math.max(
          Number(rule.minPayment || 0),
          Number(rule.amount || 0)
        );
      }

      if (rule.mode === 'per_person') {
        return Math.max(
          Number(rule.minPayment || 0),
          count * Number(rule.amount || 0)
        );
      }

      if (rule.mode === 'ranges') {
        const range = (rule.ranges || [])
          .find(r => {
            const min = Number(r.min || 0);
            const max = r.max === '' || r.max === null || r.max === undefined
              ? Infinity
              : Number(r.max);

            return count >= min && count <= max;
          });

        if (range) {
          return Math.max(
            Number(rule.minPayment || 0),
            Number(range.amount || 0)
          );
        }

        return Number(rule.minPayment || 0);
      }

      return 0;
    }

    function getCustomRule(group, school) {
      if (group?.customRule) {
        return group.customRule;
      }

      if (school?.customRule) {
        return school.customRule;
      }

      return null;
    }

    function calculatePaymentForForm() {
      const group = groups.value.find(
        g => g.id === lessonForm.groupId
      );

      const school = schools.value.find(
        s => s.id === lessonForm.schoolId
      );

      const custom = getCustomRule(group, school);

      if (custom) {
        return calculateRule(custom, lessonForm.people);
      }

      const type = types.value.find(
        t => t.id === lessonForm.type
      );

      return calculateRule(type, lessonForm.people);
    }

    const calculatedPayment = computed(() =>
      calculatePaymentForForm()
    );

    function updateAutomaticPayment() {
      if (!lessonForm.paymentManual) {
        lessonForm.payment = calculatedPayment.value;
      }
    }

    watch(
      () => [
        lessonForm.type,
        lessonForm.people,
        lessonForm.schoolId,
        lessonForm.groupId
      ],
      () => {
        updateAutomaticPayment();
      }
    );

    function resetLessonForm() {
      Object.assign(lessonForm, {
        id: '',
        date: todayISO(),
        start: '10:00',
        end: '11:00',
        type: 'group',
        otherText: '',
        studentName: '',
        directionId: '',
        schoolId: '',
        groupId: '',
        people: 1,
        payment: 0,
        paymentManual: false,
        status: 'planned',
        note: ''
      });

      updateAutomaticPayment();
    }

    function openAddLesson(date = selectedDate.value) {
      resetLessonForm();
      lessonForm.date = date;
      showLessonModal.value = true;
    }

    function openEditLesson(lesson) {
      Object.assign(
        lessonForm,
        clone(normalizeLesson(lesson))
      );

      editingLesson.value = lesson.id;
      showLessonModal.value = true;
    }

    function closeLessonModal() {
      showLessonModal.value = false;
      editingLesson.value = null;
    }

    function timeToMinutes(time) {
      const [h, m] = String(time || '00:00').split(':').map(Number);
      return h * 60 + m;
    }

    function lessonsOverlap(a, b) {
      if (a.date !== b.date) return false;

      const aStart = timeToMinutes(a.start);
      const aEnd = timeToMinutes(a.end);
      const bStart = timeToMinutes(b.start);
      const bEnd = timeToMinutes(b.end);

      return aStart < bEnd && bStart < aEnd;
    }

    function getConflictingLessons(candidate, excludeId = '') {
      return lessons.value.filter(existing => {
        if (existing.id === excludeId) return false;
        if (existing.status === 'cancelled') return false;
        return lessonsOverlap(candidate, existing);
      });
    }

    function conflictText(conflicts) {
      return conflicts.map(l =>
        `${l.start}–${l.end} — ${lessonDisplayTitle(l)}`
      ).join('\n');
    }

    function saveLesson() {
      if (!lessonForm.date) {
        alert('Выбери дату.');
        return;
      }

      if (!lessonForm.start || !lessonForm.end) {
        alert('Укажи время начала и окончания.');
        return;
      }

      if (lessonForm.type === 'other' && !lessonForm.otherText.trim()) {
        alert('Напиши, что именно означает «Другое».');
        return;
      }

      const data = normalizeLesson({
        ...lessonForm,
        payment: Number(lessonForm.payment) || 0,
        people: Number(lessonForm.people) || 0
      });

      const conflicts = getConflictingLessons(
        data,
        editingLesson.value || ''
      );

      if (conflicts.length) {
        const ok = confirm(
          `На это время уже есть занятие:\n\n${conflictText(conflicts)}\n\nВсё равно сохранить?`
        );

        if (!ok) return;
      }

      if (editingLesson.value) {
        const index = lessons.value.findIndex(
          l => l.id === editingLesson.value
        );

        if (index !== -1) {
          lessons.value[index] = data;
        }
      } else {
        lessons.value.push(data);
      }

      saveJSON(STORAGE.lessons, lessons.value);

      closeLessonModal();
    }

    function deleteLesson(lesson) {
      if (!confirm('Удалить это занятие?')) {
        return;
      }

      lessons.value = lessons.value.filter(
        l => l.id !== lesson.id
      );

      saveJSON(STORAGE.lessons, lessons.value);
    }

    function copyLesson(lesson) {
      const copy = normalizeLesson({
        ...clone(lesson),
        id: '',
        date: addDays(lesson.date, 7),
        status: 'planned',
        createdAt: Date.now()
      });

      Object.assign(lessonForm, copy);
      lessonForm.paymentManual = Boolean(lesson.paymentManual);
      editingLesson.value = null;
      showLessonModal.value = true;

      if (!lessonForm.paymentManual) {
        updateAutomaticPayment();
      }
    }

    function setLessonStatus(lesson, status) {
      const found = lessons.value.find(l => l.id === lesson.id);

      if (!found) return;

      found.status = status;

      saveJSON(STORAGE.lessons, lessons.value);
    }

    function toggleDone(lesson) {
      setLessonStatus(
        lesson,
        lesson.status === 'done' ? 'planned' : 'done'
      );
    }

    function cancelLesson(lesson) {
      setLessonStatus(lesson, 'cancelled');
    }

    function activeLessonsForDate(date) {
      return lessons.value
        .filter(l => l.date === date)
        .sort((a, b) => a.start.localeCompare(b.start));
    }

    const todayLessons = computed(() =>
      activeLessonsForDate(todayISO())
    );

    const selectedDayLessons = computed(() =>
      activeLessonsForDate(selectedDate.value)
    );

    const todayStats = computed(() => {
      const arr = todayLessons.value.filter(
        l => l.status !== 'cancelled'
      );

      return {
        lessons: arr.length,
        minutes: arr.reduce((sum, l) => sum + lessonMinutes(l), 0),
        people: arr.reduce((sum, l) => sum + Number(l.people || 0), 0),
        earned: arr.reduce((sum, l) => sum + Number(l.payment || 0), 0)
      };
    });

    const selectedDayStats = computed(() => {
      const arr = selectedDayLessons.value.filter(
        l => l.status !== 'cancelled'
      );

      return {
        lessons: arr.length,
        minutes: arr.reduce((sum, l) => sum + lessonMinutes(l), 0),
        people: arr.reduce((sum, l) => sum + Number(l.people || 0), 0),
        earned: arr.reduce((sum, l) => sum + Number(l.payment || 0), 0)
      };
    });

    const weekDays = computed(() => {
      const start = startOfWeek(selectedDate.value);

      return Array.from({ length: 7 }, (_, i) => {
        const date = addDays(start, i);

        return {
          date,
          label: weekdayShort(date),
          short: shortDate(date),
          lessons: activeLessonsForDate(date)
        };
      });
    });

    const monthDays = computed(() => {
      const start = parseISO(startOfMonth(selectedDate.value));
      const end = parseISO(endOfMonth(selectedDate.value));

      const firstDay = start.getDay();
      const mondayOffset = firstDay === 0 ? 6 : firstDay - 1;

      const days = [];

      for (let i = 0; i < mondayOffset; i++) {
        const d = new Date(start);
        d.setDate(d.getDate() - (mondayOffset - i));

        days.push({
          date: dateToISO(d),
          currentMonth: false,
          lessons: activeLessonsForDate(dateToISO(d))
        });
      }

      for (let i = 1; i <= end.getDate(); i++) {
        const d = new Date(
          start.getFullYear(),
          start.getMonth(),
          i
        );

        const iso = dateToISO(d);

        days.push({
          date: iso,
          currentMonth: true,
          lessons: activeLessonsForDate(iso)
        });
      }

      while (days.length < 42) {
        const iso = addDays(days[days.length - 1].date, 1);

        days.push({
          date: iso,
          currentMonth: false,
          lessons: activeLessonsForDate(iso)
        });
      }

      return days;
    });

    function calendarPrev() {
      if (calendarMode.value === 'month') {
        const d = parseISO(selectedDate.value);
        d.setMonth(d.getMonth() - 1);
        selectedDate.value = dateToISO(d);
        return;
      }

      if (calendarMode.value === 'week') {
        selectedDate.value = addDays(selectedDate.value, -7);
        return;
      }

      selectedDate.value = addDays(selectedDate.value, -1);
    }

    function calendarNext() {
      if (calendarMode.value === 'month') {
        const d = parseISO(selectedDate.value);
        d.setMonth(d.getMonth() + 1);
        selectedDate.value = dateToISO(d);
        return;
      }

      if (calendarMode.value === 'week') {
        selectedDate.value = addDays(selectedDate.value, 7);
        return;
      }

      selectedDate.value = addDays(selectedDate.value, 1);
    }

    function selectCalendarDay(date) {
      selectedDate.value = date;
    }

    function isToday(date) {
      return date === todayISO();
    }

    function isSelected(date) {
      return date === selectedDate.value;
    }

    function copyWeek() {
      const start = startOfWeek(selectedDate.value);

      const sourceWeek = [];

      for (let i = 0; i < 7; i++) {
        const date = addDays(start, i);

        const dayLessons = activeLessonsForDate(date);

        dayLessons.forEach(lesson => {
          if (
            lesson.type === 'individual' ||
            lesson.type === 'substitution'
          ) {
            return;
          }

          sourceWeek.push({
            lesson,
            dayOffset: i
          });
        });
      }

      if (!sourceWeek.length) {
        alert('В выбранной неделе нет регулярных занятий для копирования.');
        return;
      }

      let copied = 0;

      sourceWeek.forEach(item => {
        const newDate = addDays(
          start,
          7 + item.dayOffset
        );

        const alreadyExists = lessons.value.some(l =>
          l.date === newDate &&
          l.start === item.lesson.start &&
          l.end === item.lesson.end &&
          l.type === item.lesson.type &&
          l.schoolId === item.lesson.schoolId &&
          l.groupId === item.lesson.groupId
        );

        if (alreadyExists) {
          return;
        }

        lessons.value.push(
          normalizeLesson({
            ...clone(item.lesson),
            id: uid('lesson'),
            date: newDate,
            status: 'planned',
            createdAt: Date.now()
          })
        );

        copied++;
      });

      saveJSON(STORAGE.lessons, lessons.value);

      alert(
        copied
          ? `Скопировано занятий: ${copied}`
          : 'Новых занятий не добавлено — такие занятия уже существуют.'
      );
    }

    function addDirection() {
      const name = prompt('Название направления:');
      if (!name || !name.trim()) return;

      directions.value.push({
        id: uid('direction'),
        name: name.trim()
      });

      saveJSON(STORAGE.directions, directions.value);
    }

    function renameDirection(direction) {
      const name = prompt('Новое название направления:', direction.name);
      if (!name || !name.trim()) return;

      direction.name = name.trim();
      saveJSON(STORAGE.directions, directions.value);
    }

    function deleteDirection(direction) {
      if (!confirm(`Удалить направление «${direction.name}»?`)) return;

      directions.value = directions.value.filter(d => d.id !== direction.id);
      saveJSON(STORAGE.directions, directions.value);
    }

    function openSchoolModal(school = null) {
      Object.assign(schoolForm, {
        id: school?.id || '',
        name: school?.name || ''
      });

      showSchoolModal.value = true;
    }

    function saveSchool() {
      const name = schoolForm.name.trim();

      if (!name) {
        alert('Введи название школы.');
        return;
      }

      if (schoolForm.id) {
        const found = schools.value.find(
          s => s.id === schoolForm.id
        );

        if (found) {
          found.name = name;
        }
      } else {
        schools.value.push({
          id: uid('school'),
          name,
          archived: false,
          customRule: null
        });
      }

      saveJSON(STORAGE.schools, schools.value);

      showSchoolModal.value = false;
    }

    function archiveSchool(school) {
      if (!confirm(`Архивировать школу «${school.name}»?`)) {
        return;
      }

      school.archived = true;

      saveJSON(STORAGE.schools, schools.value);
    }

    function restoreSchool(school) {
      school.archived = false;

      saveJSON(STORAGE.schools, schools.value);
    }

    function deleteSchool(school) {
      if (!confirm(`Удалить школу «${school.name}»? Это действие нельзя отменить.`)) {
        return;
      }

      schools.value = schools.value.filter(s => s.id !== school.id);
      saveJSON(STORAGE.schools, schools.value);
    }

    function openGroupModal(group = null) {
      Object.assign(groupForm, {
        id: group?.id || '',
        name: group?.name || '',
        schoolId: group?.schoolId || '',
        customRule: clone(group?.customRule || null)
      });

      showGroupModal.value = true;
    }

    function saveGroup() {
      const name = groupForm.name.trim();

      if (!name) {
        alert('Введи название группы.');
        return;
      }

      if (groupForm.id) {
        const found = groups.value.find(
          g => g.id === groupForm.id
        );

        if (found) {
          found.name = name;
          found.schoolId = groupForm.schoolId;
          found.customRule = clone(groupForm.customRule);
        }
      } else {
        groups.value.push({
          id: uid('group'),
          name,
          schoolId: groupForm.schoolId,
          archived: false,
          customRule: clone(groupForm.customRule)
        });
      }

      saveJSON(STORAGE.groups, groups.value);

      showGroupModal.value = false;
    }

    function archiveGroup(group) {
      if (!confirm(`Архивировать группу «${group.name}»?`)) {
        return;
      }

      group.archived = true;

      saveJSON(STORAGE.groups, groups.value);
    }

    function restoreGroup(group) {
      group.archived = false;

      saveJSON(STORAGE.groups, groups.value);
    }

    function deleteGroup(group) {
      if (!confirm(`Удалить группу «${group.name}»? Это действие нельзя отменить.`)) {
        return;
      }

      groups.value = groups.value.filter(g => g.id !== group.id);
      saveJSON(STORAGE.groups, groups.value);
    }

    function addRange() {
      typeForm.ranges.push({
        id: uid('range'),
        min: 1,
        max: '',
        amount: 0
      });
    }

    function removeRange(index) {
      typeForm.ranges.splice(index, 1);
    }

    function openTypeModal(type) {
      Object.assign(
        typeForm,
        clone(type)
      );

      typeForm.ranges = typeForm.ranges || [];

      showTypeModal.value = true;
    }

    function saveType() {
      const found = types.value.find(
        t => t.id === typeForm.id
      );

      if (!found) return;

      found.name = typeForm.name.trim() || found.name;
      found.mode = typeForm.mode;
      found.amount = Number(typeForm.amount) || 0;
      found.minPayment = Number(typeForm.minPayment) || 0;
      found.ranges = clone(typeForm.ranges || []);

      saveJSON(STORAGE.types, types.value);

      showTypeModal.value = false;
    }

    function resetAllData() {
      const ok = confirm(
        'Удалить ВСЕ школы, группы и занятия? Это действие нельзя отменить без резервной копии.'
      );

      if (!ok) return;

      schools.value = [];
      groups.value = [];
      lessons.value = [];
      directions.value = [];

      saveJSON(STORAGE.schools, schools.value);
      saveJSON(STORAGE.groups, groups.value);
      saveJSON(STORAGE.lessons, lessons.value);
      saveJSON(STORAGE.directions, directions.value);
    }

    function exportData() {
      const data = {
        version: 1,
        exportedAt: new Date().toISOString(),
        currency: currency.value,
        schools: clone(schools.value),
        groups: clone(groups.value),
        lessons: clone(lessons.value),
        types: clone(types.value),
        directions: clone(directions.value),
        theme: theme.value,
        reminder: reminder.value
      };

      const blob = new Blob(
        [JSON.stringify(data, null, 2)],
        { type: 'application/json' }
      );

      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `dance-planner-backup-${todayISO()}.json`;
      a.click();

      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files?.[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);

          if (!data || typeof data !== 'object') {
            throw new Error();
          }

          if (!confirm('Заменить текущие данные данными из резервной копии?')) {
            return;
          }

          schools.value = Array.isArray(data.schools)
            ? data.schools
            : [];

          groups.value = Array.isArray(data.groups)
            ? data.groups
            : [];

          lessons.value = Array.isArray(data.lessons)
            ? data.lessons.map(normalizeLesson)
            : [];

          types.value = Array.isArray(data.types) && data.types.length
            ? data.types
            : clone(DEFAULT_TYPES);

          directions.value = Array.isArray(data.directions)
            ? data.directions
            : [];

          currency.value = data.currency || 'грн';

          if (data.theme) {
            theme.value = data.theme;
          }

          if (data.reminder) {
            reminder.value = data.reminder;
          }

          saveJSON(STORAGE.schools, schools.value);
          saveJSON(STORAGE.groups, groups.value);
          saveJSON(STORAGE.lessons, lessons.value);
          saveJSON(STORAGE.types, types.value);
          saveJSON(STORAGE.directions, directions.value);

          localStorage.setItem(
            STORAGE.currency,
            currency.value
          );

          localStorage.setItem(
            STORAGE.theme,
            theme.value
          );

          localStorage.setItem(
            STORAGE.reminder,
            reminder.value
          );

          applyTheme();

          alert('Данные успешно восстановлены.');
        } catch {
          alert('Не удалось прочитать резервную копию.');
        }
      };

      reader.readAsText(file);

      event.target.value = '';
    }

    function applyTheme() {
      const root = document.documentElement;

      if (theme.value === 'dark') {
        root.classList.add('dark');
        return;
      }

      if (theme.value === 'light') {
        root.classList.remove('dark');
        return;
      }

      const prefersDark = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches;

      root.classList.toggle('dark', prefersDark);
    }

    watch(theme, value => {
      localStorage.setItem(STORAGE.theme, value);
      applyTheme();
    });

    watch(reminder, value => {
      localStorage.setItem(STORAGE.reminder, value);
    });

    watch(currency, value => {
      localStorage.setItem(STORAGE.currency, value);
    });

    const financeRange = computed(() => {
      const today = todayISO();

      if (financeMode.value === 'week') {
        return {
          from: startOfWeek(today),
          to: endOfWeek(today)
        };
      }

      if (financeMode.value === 'month') {
        return {
          from: startOfMonth(today),
          to: endOfMonth(today)
        };
      }

      return {
        from: financeFrom.value || startOfMonth(today),
        to: financeTo.value || endOfMonth(today)
      };
    });

    const financeLessons = computed(() => {
      const { from, to } = financeRange.value;

      return lessons.value
        .filter(l => l.date >= from && l.date <= to)
        .sort((a, b) => {
          if (a.date === b.date) {
            return a.start.localeCompare(b.start);
          }

          return a.date.localeCompare(b.date);
        });
    });

    const financeStats = computed(() => {
      const arr = financeLessons.value.filter(
        l => l.status !== 'cancelled'
      );

      const earned = arr.reduce(
        (sum, l) => sum + Number(l.payment || 0),
        0
      );

      const planned = financeLessons.value.filter(
        l => l.status === 'planned'
      ).reduce(
        (sum, l) => sum + Number(l.payment || 0),
        0
      );

      const minutes = arr.reduce(
        (sum, l) => sum + lessonMinutes(l),
        0
      );

      const people = arr.reduce(
        (sum, l) => sum + Number(l.people || 0),
        0
      );

      return {
        earned,
        planned,
        minutes,
        people,
        lessons: arr.length,
        average: arr.length
          ? earned / arr.length
          : 0
      };
    });

    const financeDays = computed(() => {
      const { from, to } = financeRange.value;

      const result = [];

      let current = from;

      while (current <= to) {
        const dayLessons = lessons.value.filter(
          l =>
            l.date === current &&
            l.status !== 'cancelled'
        );

        const amount = dayLessons.reduce(
          (sum, l) => sum + Number(l.payment || 0),
          0
        );

        result.push({
          date: current,
          label: parseISO(current).getDate(),
          amount
        });

        current = addDays(current, 1);
      }

      return result;
    });

    const financeMax = computed(() =>
      Math.max(
        1,
        ...financeDays.value.map(d => d.amount)
      )
    );

    function setFinanceMode(mode) {
      financeMode.value = mode;

      if (mode === 'custom') {
        if (!financeFrom.value) {
          financeFrom.value = startOfMonth(todayISO());
        }

        if (!financeTo.value) {
          financeTo.value = endOfMonth(todayISO());
        }
      }
    }

    function switchView(newView) {
      view.value = newView;
    }

    function changePeople(amount) {
      lessonForm.people = Math.max(
        1,
        Number(lessonForm.people || 1) + amount
      );

      updateAutomaticPayment();
    }

    function formatMoney(value) {
      return `${Math.round(Number(value) || 0)} ${currency.value}`;
    }

    function lessonDisplayTitle(lesson) {
      if (lesson.type === 'other' && lesson.otherText) {
        return lesson.otherText;
      }

      if (lesson.type === 'individual') {
        const student = lesson.studentName?.trim() || 'Индив';
        const dir = getDirectionName(lesson.directionId);
        return dir ? `${student} — ${dir}` : student;
      }

      return lesson.groupId
        ? getGroupName(lesson.groupId)
        : getTypeName(lesson.type);
    }

    function reminderLabel(value) {
      const labels = {
        off: 'Отключены',
        1: 'За 1 час',
        2: 'За 2 часа',
        3: 'За 3 часа'
      };

      return labels[value] || 'Отключены';
    }

    function notificationSupported() {
      return 'Notification' in window;
    }

    async function requestNotificationPermission() {
      if (!notificationSupported()) {
        return;
      }

      if (Notification.permission === 'default') {
        try {
          await Notification.requestPermission();
        } catch {}
      }
    }

    async function updateReminder(value) {
      reminder.value = value;

      if (value !== 'off') {
        await requestNotificationPermission();
      }
    }

    function checkNotifications() {
      if (
        reminder.value === 'off' ||
        !notificationSupported() ||
        Notification.permission !== 'granted'
      ) {
        return;
      }

      const hours = Number(reminder.value);

      if (!hours) return;

      const now = new Date();

      lessons.value.forEach(lesson => {
        if (lesson.status === 'cancelled') return;

        const lessonDateTime = new Date(
          `${lesson.date}T${lesson.start}:00`
        );

        const diffMinutes =
          (lessonDateTime.getTime() - now.getTime()) / 60000;

        if (
          diffMinutes >= hours * 60 - 1 &&
          diffMinutes <= hours * 60 + 1
        ) {
          const key = `${lesson.id}_${hours}`;

          if (notified.value[key]) {
            return;
          }

          const title = 'Dance Planner';

          const body =
            `Через ${hours} ${hours === 1 ? 'час' : 'часа'}: ` +
            `${lessonDisplayTitle(lesson)} в ${lesson.start}`;

          try {
            new Notification(title, { body });

            notified.value[key] = true;

            saveJSON(
              STORAGE.notified,
              notified.value
            );
          } catch {}
        }
      });
    }

    let notificationTimer = null;

    onMounted(() => {
      applyTheme();

      notificationTimer = setInterval(
        checkNotifications,
        30000
      );

      checkNotifications();
    });

    onBeforeUnmount(() => {
      if (notificationTimer) {
        clearInterval(notificationTimer);
      }
    });

    const archivedSchools = computed(() =>
      schools.value.filter(s => s.archived)
    );

    const archivedGroups = computed(() =>
      groups.value.filter(g => g.archived)
    );

    return {
      view,
      selectedDate,
      calendarMode,

      financeMode,
      financeFrom,
      financeTo,

      schools,
      groups,
      lessons,
      types,
      directions,
      currency,
      theme,
      reminder,

      activeSchools,
      activeGroups,
      archivedSchools,
      archivedGroups,
      currentSchoolGroups,

      lessonForm,
      schoolForm,
      groupForm,
      typeForm,

      showLessonModal,
      showSchoolModal,
      showGroupModal,
      showTypeModal,

      editingLesson,

      calendarTitle,
      weekDays,
      monthDays,

      todayLessons,
      selectedDayLessons,
      todayStats,
      selectedDayStats,

      calculatedPayment,

      financeRange,
      financeLessons,
      financeStats,
      financeDays,
      financeMax,

      getSchoolName,
      getGroupName,
      getTypeName,
      getDirectionName,
      statusLabel,
      statusClass,
      statusActionClass,
      lessonMinutes,
      lessonHours,
      formatHours,
      formatMoney,
      lessonDisplayTitle,
      reminderLabel,

      openAddLesson,
      openEditLesson,
      closeLessonModal,
      saveLesson,
      deleteLesson,
      copyLesson,
      toggleDone,
      cancelLesson,

      calendarPrev,
      calendarNext,
      selectCalendarDay,
      isToday,
      isSelected,
      copyWeek,

      openSchoolModal,
      saveSchool,
      archiveSchool,
      restoreSchool,
      deleteSchool,

      openGroupModal,
      saveGroup,
      archiveGroup,
      restoreGroup,
      deleteGroup,

      openTypeModal,
      saveType,
      addRange,
      removeRange,

      addDirection,
      renameDirection,
      deleteDirection,

      resetAllData,
      exportData,
      importData,

      switchView,
      changePeople,
      updateReminder,
      setFinanceMode,

      todayISO,
      formatDate,
      shortDate,
      weekdayShort,
      monthYear
    };
  },

  template: `
    <div
      class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100"
    >
      <div class="mx-auto max-w-md min-h-screen">

        <!-- HEADER -->
        <header
          class="sticky top-0 z-30 bg-slate-50/95 dark:bg-slate-950/95 backdrop-blur border-b border-slate-200 dark:border-slate-800"
        >
          <div class="px-4 py-3 flex items-center justify-between">
            <div>
              <div class="font-bold text-lg leading-tight">
                Dance Planner
              </div>

              <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                {{ formatDate(todayISO()) }}
              </div>
            </div>

            <button
              @click="switchView('settings')"
              class="w-10 h-10 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-center"
            >
              <i class="fa-solid fa-gear text-sm"></i>
            </button>
          </div>
        </header>

        <!-- CONTENT -->
        <main class="px-4 pt-4 pb-28">

          <!-- TODAY -->
          <section v-if="view === 'today'">

            <div class="mb-4">
              <h1 class="text-2xl font-bold">
                Сегодня
              </h1>

              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                {{ formatDate(todayISO(), { weekday: 'long' }) }}
              </p>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-4">
              <StatCard
                label="Занятий"
                :value="todayStats.lessons"
                icon="fa-solid fa-calendar-check"
              />

              <StatCard
                label="Часы"
                :value="formatHours(todayStats.minutes)"
                icon="fa-solid fa-clock"
              />

              <StatCard
                label="Людей"
                :value="todayStats.people"
                icon="fa-solid fa-users"
              />

              <StatCard
                label="Заработано"
                :value="formatMoney(todayStats.earned)"
                icon="fa-solid fa-money-bill"
              />
            </div>

            <div class="flex items-center justify-between mb-3">
              <h2 class="font-semibold">
                Занятия
              </h2>

              <button
                @click="openAddLesson(todayISO())"
                class="text-sm text-blue-600 dark:text-blue-400 font-medium"
              >
                + Добавить
              </button>
            </div>

            <div
              v-if="!todayLessons.length"
              class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 text-center"
            >
              <div class="text-3xl mb-3">
                📅
              </div>

              <div class="font-medium">
                На сегодня занятий нет
              </div>

              <div class="text-sm text-slate-500 mt-1">
                Добавь первое занятие
              </div>

                <PaymentEditor
                  v-model="lessonForm.payment"
                  v-model:manual="lessonForm.paymentManual"
                  :calculated="calculatedPayment"
                  :currency="currency"
                />

                <FormField label="Статус">
                  <select
                    v-model="lessonForm.status"
                    class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5"
                  >
                    <option value="planned">
                      Запланировано
                    </option>

                    <option value="done">
                      Проведено
                    </option>

                    <option value="cancelled">
                      Отменено
                    </option>
                  </select>
                </FormField>

                <FormField label="Заметка">
                  <textarea
                    v-model="lessonForm.note"
                    rows="3"
                    placeholder="Дополнительная информация"
                    class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5 resize-none"
                  ></textarea>
                </FormField>

                <div class="grid grid-cols-2 gap-2 pt-1">

                  <button
                    @click="closeLessonModal"
                    class="py-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-medium"
                  >
                    Отмена
                  </button>

                  <button
                    @click="saveLesson"
                    class="py-3 rounded-xl bg-blue-600 text-white font-semibold"
                  >
                    Сохранить
                  </button>

                </div>

              </div>

            </div>

          </div>

        </transition>


        <!-- SCHOOL MODAL -->
        <transition name="fade">

          <div
            v-if="showSchoolModal"
            class="fixed inset-0 z-[60] bg-black/50 flex items-end justify-center"
            @click.self="showSchoolModal = false"
          >

            <div
              class="w-full max-w-md bg-white dark:bg-slate-900 rounded-t-3xl p-4"
            >

              <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold">
                  {{ schoolForm.id ? 'Редактировать школу' : 'Новая школа' }}
                </h2>

                <button
                  @click="showSchoolModal = false"
                  class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-lg"
                >
                  ×
                </button>
              </div>

              <label class="text-xs text-slate-500">
                Название
              </label>

              <input
                v-model="schoolForm.name"
                type="text"
                placeholder="Название школы"
                class="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5"
              >

              <button
                @click="saveSchool"
                class="mt-4 w-full py-3 rounded-xl bg-blue-600 text-white font-semibold"
              >
                Сохранить
              </button>

            </div>

          </div>

        </transition>


        <!-- GROUP MODAL -->
        <transition name="fade">

          <div
            v-if="showGroupModal"
            class="fixed inset-0 z-[60] bg-black/50 flex items-end justify-center"
            @click.self="showGroupModal = false"
          >

            <div
              class="w-full max-w-md max-h-[90vh] overflow-y-auto bg-white dark:bg-slate-900 rounded-t-3xl p-4"
            >

              <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold">
                  {{ groupForm.id ? 'Редактировать группу' : 'Новая группа' }}
                </h2>

                <button
                  @click="showGroupModal = false"
                  class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-lg"
                >
                  ×
                </button>
              </div>

              <div class="space-y-4">

                <div>
                  <label class="text-xs text-slate-500">
                    Название
                  </label>

                  <input
                    v-model="groupForm.name"
                    type="text"
                    placeholder="Название группы / ученика"
                    class="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5"
                  >
                </div>

                <div>
                  <label class="text-xs text-slate-500">
                    Школа
                  </label>

                  <select
                    v-model="groupForm.schoolId"
                    class="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5"
                  >
                    <option value="">
                      Без школы
                    </option>

                    <option
                      v-for="school in activeSchools"
                      :key="school.id"
                      :value="school.id"
                    >
                      {{ school.name }}
                    </option>
                  </select>
                </div>

                <div
                  class="border-t border-slate-100 dark:border-slate-800 pt-4"
                >

                  <div class="font-semibold text-sm mb-1">
                    Своя оплата группы
                  </div>

                  <div class="text-xs text-slate-400 mb-3">
                    Если задать правило здесь, оно будет иметь приоритет
                    над правилом школы и типа занятия.
                  </div>

                  <select
                    :value="groupForm.customRule?.mode || 'none'"
                    @change="
                      groupForm.customRule =
                        $event.target.value === 'none'
                          ? null
                          : {
                              mode: $event.target.value,
                              amount: 0,
                              minPayment: 0,
                              ranges: []
                            }
                    "
                    class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5"
                  >
                    <option value="none">
                      Использовать общее правило
                    </option>

                    <option value="fixed">
                      Фиксированная сумма
                    </option>

                    <option value="per_person">
                      За человека
                    </option>

                    <option value="ranges">
                      По количеству людей
                    </option>

                    <option value="manual">
                      Вручную
                    </option>
                  </select>

                  <div
                    v-if="groupForm.customRule && groupForm.customRule.mode !== 'manual'"
                    class="mt-3 space-y-3"
                  >

                    <div
                      v-if="groupForm.customRule.mode === 'fixed' ||
                        groupForm.customRule.mode === 'per_person'"
                    >
                      <label class="text-xs text-slate-500">
                        {{ groupForm.customRule.mode === 'fixed'
                          ? 'Сумма'
                          : 'Сумма за человека'
                        }}
                      </label>

                      <input
                        v-model.number="groupForm.customRule.amount"
                        type="number"
                        min="0"
                        class="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5"
                      >
                    </div>

                    <div
                      v-if="groupForm.customRule.mode === 'ranges'"
                    >

                      <div
                        v-for="(range, index) in groupForm.customRule.ranges"
                        :key="range.id || index"
                        class="grid grid-cols-[1fr_1fr_1.2fr_auto] gap-1.5 mb-2"
                      >

                        <input
                          v-model.number="range.min"
                          type="number"
                          min="1"
                          placeholder="От"
                          class="min-w-0 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-2 py-2 text-sm"
                        >

                        <input
                          v-model="range.max"
                          type="number"
                          min="1"
                          placeholder="До"
                          class="min-w-0 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-2 py-2 text-sm"
                        >

                        <input
                          v-model.number="range.amount"
                          type="number"
                          min="0"
                          placeholder="Сумма"
                          class="min-w-0 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-2 py-2 text-sm"
                        >

                        <button
                          @click="groupForm.customRule.ranges.splice(index, 1)"
                          class="w-9 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-500 flex items-center justify-center"
                        >
                          ×
                        </button>

                      </div>

                      <button
                        @click="
                          groupForm.customRule.ranges.push({
                            id: Date.now() + Math.random(),
                            min: 1,
                            max: '',
                            amount: 0
                          })
                        "
                        class="text-xs text-blue-600 dark:text-blue-400 font-medium"
                      >
                        + Добавить диапазон
                      </button>

                    </div>

                    <div
                      v-if="groupForm.customRule.mode !== 'manual'"
                    >
                      <label class="text-xs text-slate-500">
                        Минимальная оплата
                      </label>

                      <input
                        v-model.number="groupForm.customRule.minPayment"
                        type="number"
                        min="0"
                        class="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5"
                      >
                    </div>

                  </div>

                </div>

                <button
                  @click="saveGroup"
                  class="w-full py-3 rounded-xl bg-blue-600 text-white font-semibold"
                >
                  Сохранить
                </button>

              </div>

            </div>

          </div>

        </transition>


        <!-- TYPE MODAL -->
        <transition name="fade">

          <div
            v-if="showTypeModal"
            class="fixed inset-0 z-[70] bg-black/50 flex items-end justify-center"
            @click.self="showTypeModal = false"
          >

            <div
              class="w-full max-w-md max-h-[92vh] overflow-y-auto bg-white dark:bg-slate-900 rounded-t-3xl p-4"
            >

              <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold">
                  {{ typeForm.name }}
                </h2>

                <button
                  @click="showTypeModal = false"
                  class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-lg"
                >
                  ×
                </button>
              </div>

              <div class="space-y-4">

                <div>
                  <label class="text-xs text-slate-500">
                    Название
                  </label>

                  <input
                    v-model="typeForm.name"
                    type="text"
                    class="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5"
                  >
                </div>

                <div>
                  <label class="text-xs text-slate-500">
                    Способ расчёта
                  </label>

                  <select
                    v-model="typeForm.mode"
                    class="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5"
                  >
                    <option value="fixed">
                      Фиксированная сумма
                    </option>

                    <option value="per_person">
                      За человека
                    </option>

                    <option value="ranges">
                      По количеству людей
                    </option>

                    <option value="manual">
                      Вручную
                    </option>
                  </select>
                </div>

                <div
                  v-if="typeForm.mode === 'fixed' ||
                    typeForm.mode === 'per_person'"
                >
                  <label class="text-xs text-slate-500">
                    {{ typeForm.mode === 'fixed'
                      ? 'Сумма'
                      : 'Сумма за человека'
                    }}
                  </label>

                  <input
                    v-model.number="typeForm.amount"
                    type="number"
                    min="0"
                    class="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5"
                  >
                </div>

                <div
                  v-if="typeForm.mode === 'ranges'"
                >

                  <div class="font-medium text-sm mb-2">
                    Диапазоны
                  </div>

                  <div
                    v-for="(range, index) in typeForm.ranges"
                    :key="range.id || index"
                    class="grid grid-cols-[1fr_1fr_1.2fr_auto] gap-1.5 mb-2"
                  >

                    <input
                      v-model.number="range.min"
                      type="number"
                      min="1"
                      placeholder="От"
                      class="min-w-0 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-2 py-2 text-sm"
                    >

                    <input
                      v-model="range.max"
                      type="number"
                      min="1"
                      placeholder="До"
                      class="min-w-0 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-2 py-2 text-sm"
                    >

                    <input
                      v-model.number="range.amount"
                      type="number"
                      min="0"
                      placeholder="Сумма"
                      class="min-w-0 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-2 py-2 text-sm"
                    >

                    <button
                      @click="removeRange(index)"
                      class="w-9 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-500 flex items-center justify-center"
                    >
                      ×
                    </button>

                  </div>

                  <button
                    @click="addRange"
                    class="text-xs text-blue-600 dark:text-blue-400 font-medium"
                  >
                    + Добавить диапазон
                  </button>

                </div>

                <div
                  v-if="typeForm.mode !== 'manual'"
                >
                  <label class="text-xs text-slate-500">
                    Минимальная оплата
                  </label>

                  <input
                    v-model.number="typeForm.minPayment"
                    type="number"
                    min="0"
                    class="mt-1 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5"
                  >
                </div>

                <button
                  @click="saveType"
                  class="w-full py-3 rounded-xl bg-blue-600 text-white font-semibold"
                >
                  Сохранить
                </button>

              </div>

            </div>

          </div>

        </transition>

      </div>
    </div>
  `
}).mount('#app');
</script>

</body>
</html>
